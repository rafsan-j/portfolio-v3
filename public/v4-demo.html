  <style>
    :root {
      --bg: #080b0f;
      --surface: #131720;
      --border: #252b37;
      --text: #EAECEF;
      --muted: #8A94A6;
      --accent: #6BD0C2;
      --warm: #F59E0B;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    #canvas-wrap { position: fixed; inset: 0; z-index: 1; cursor: grab; }
    #canvas-wrap.pointer-hover { cursor: pointer; }
    #canvas-wrap:active { cursor: grabbing; }

    .tactile {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease, opacity 0.25s ease;
    }
    .tactile:active { transform: scale(0.93); }

    .dock-btn {
      width: 40px; height: 40px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); position: relative;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease;
    }
    .dock-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .dock-btn.active { background: var(--accent); color: #080b0f; transform: scale(1.06); }
    .dock-tip {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%) translateY(4px);
      background: #131720; border: 1px solid #252b37; color: #EAECEF;
      font-size: 11px; padding: 4px 10px; border-radius: 9999px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.16s ease, transform 0.16s ease;
    }
    .dock-btn:hover .dock-tip { opacity: 1; transform: translateX(-50%) translateY(0); }

    #action-toast {
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #action-toast.hidden-toast {
      opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
    }

    #hover-pill {
      position: fixed; z-index: 25; pointer-events: none;
      transform: translate(14px, 14px);
      transition: opacity 0.14s ease;
    }
    #hover-pill.hidden-pill { opacity: 0; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

        <i data-lucide="volume-x" class="w-4 h-4"></i>

    let audioCtx = null;
    let rainGain = null;
    let musicTimer = null;
    let chordStep = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Procedural soft rain noise (filtered brown/pink noise)
        const bufSize = audioCtx.sampleRate * 2;
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const out = noiseBuf.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          out[i] = (lastOut + 0.04 * white) / 1.04;
          lastOut = out[i];
          out[i] *= 2.4;
        }
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = noiseBuf;
        noiseSrc.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 950;
        filter.Q.value = 0.6;
        rainGain = audioCtx.createGain();
        rainGain.gain.value = 0;
        noiseSrc.connect(filter); filter.connect(rainGain); rainGain.connect(audioCtx.destination);
        noiseSrc.start();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function syncAmbience() {
      if (!audioCtx || !rainGain) return;
      const isRain = WEATHER_MODES[app.weatherIdx] === 'rain';
      const targetRain = app.soundOn && isRain ? 0.065 : 0;
      rainGain.gain.setTargetAtTime(targetRain, audioCtx.currentTime, 0.25);

      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
      if (app.soundOn && app.musicPlaying) {
        triggerChord();
        musicTimer = setInterval(triggerChord, 2500);
      }
    }

    function playFoley(freq = 560, dur = 0.04, vol = 0.04, type = 'triangle') {
      if (!app.soundOn) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch (_) {}
    }

    let foleyNoiseBuf = null;
    function playNoise(bandHz = 1800, Q = 1.2, dur = 0.08, vol = 0.05) {
      if (!app.soundOn) return;
      try {
        initAudio();
        if (!foleyNoiseBuf) {
          const len = Math.floor(audioCtx.sampleRate * 0.25);
          foleyNoiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const ch = foleyNoiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        }
        const src = audioCtx.createBufferSource(); src.buffer = foleyNoiseBuf;
        const flt = audioCtx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = bandHz; flt.Q.value = Q;
        const g = audioCtx.createGain();

        src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);

    function playChime(f1 = 880, f2 = 1175, dur = 0.09, vol = 0.035) {
      if (!app.soundOn) return;
      try {
        initAudio();

        [f1, f2].forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.025);
          g.gain.setValueAtTime(vol, now + idx * 0.025);
          g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.025 + dur);
          osc.connect(g); g.connect(audioCtx.destination);

      if (!app.soundOn || !app.musicPlaying) return;

    function makeTex(canvas, isSRGB, rx = 1, ry = 1) {
      const t = new THREE.CanvasTexture(canvas);

      if (isSRGB) t.encoding = THREE.sRGBEncoding;

    function createWalnutPBR(rx = 2.8, ry = 1.3) {
      const S = 512;
      const cA = document.createElement('canvas'), cB = document.createElement('canvas'), cR = document.createElement('canvas');
      [cA, cB, cR].forEach(c => { c.width = c.height = S; });
      const a = cA.getContext('2d'), b = cB.getContext('2d'), r = cR.getContext('2d');
      a.fillStyle = '#3b2618'; a.fillRect(0, 0, S, S);
      b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
      r.fillStyle = '#7a7a7a'; r.fillRect(0, 0, S, S);
      for (let y = 0; y < S; y++) {
        const wave = Math.sin(y * 0.045) * 0.5 + Math.sin(y * 0.13 + 1.4) * 0.3 + Math.sin(y * 0.31) * 0.2;
        const band = Math.pow(0.5 + 0.5 * wave, 1.8);
        a.fillStyle = band > 0.55 ? `rgba(92,62,40,${(band - 0.5) * 0.65})` : `rgba(16,9,5,${(0.55 - band) * 0.72})`;
        a.fillRect(0, y, S, 1.4);
        const rv = Math.round(92 + (1 - band) * 72);
        r.fillStyle = `rgb(${rv},${rv},${rv})`; r.fillRect(0, y, S, 1.4);
        const bv = Math.round(112 + band * 34);
        b.fillStyle = `rgb(${bv},${bv},${bv})`; b.fillRect(0, y, S, 1.4);
      }
      for (let i = 0; i < 900; i++) {
        const x = Math.random() * S, y = Math.random() * S, len = 6 + Math.random() * 24;
        a.fillStyle = 'rgba(12,7,4,0.38)'; a.fillRect(x, y, len, 1);
        b.fillStyle = 'rgba(40,40,40,0.45)'; b.fillRect(x, y, len, 1);
        r.fillStyle = 'rgba(195,195,195,0.45)'; r.fillRect(x, y, len, 1);
      }
      return { map: makeTex(cA, true, rx, ry), bumpMap: makeTex(cB, false, rx, ry), roughnessMap: makeTex(cR, false, rx, ry) };
    }

    function createLeatherPBR() {
      const S = 512;
      const cA = document.createElement('canvas'), cB = document.createElement('canvas'), cR = document.createElement('canvas');
      [cA, cB, cR].forEach(c => { c.width = c.height = S; });
      const a = cA.getContext('2d'), b = cB.getContext('2d'), r = cR.getContext('2d');
      a.fillStyle = '#141821'; a.fillRect(0, 0, S, S);
      b.fillStyle = '#707070'; b.fillRect(0, 0, S, S);
      r.fillStyle = '#c8c8c8'; r.fillRect(0, 0, S, S);
      for (let i = 0; i < 5500; i++) {
        const x = Math.random() * S, y = Math.random() * S, rad = 1.1 + Math.random() * 1.8;
        const hi = Math.random() > 0.5;
        a.fillStyle = hi ? 'rgba(38,45,58,0.22)' : 'rgba(8,10,14,0.28)';
        a.beginPath(); a.arc(x, y, rad, 0, Math.PI * 2); a.fill();

        b.beginPath(); b.arc(x, y, rad, 0, Math.PI * 2); b.fill();

        r.beginPath(); r.arc(x, y, rad, 0, Math.PI * 2); r.fill();

      const pad = 16;

    function createMetalPBR(knurled = false) {
      const S = 256;

          b.beginPath(); b.moveTo(i, 0); b.lineTo(i + S, S); b.moveTo(i + S, 0); b.lineTo(i, S); b.stroke();
          r.beginPath(); r.moveTo(i, 0); r.lineTo(i + S, S); r.moveTo(i + S, 0); r.lineTo(i, S); r.stroke();
        }
      } else {
        for (let i = 0; i < 800; i++) {

    function createPlasterPBR() {

    function createFloorPlanksPBR() {
      const S = 512;
      const cA = document.createElement('canvas'), cB = document.createElement('canvas'), cR = document.createElement('canvas');
      [cA, cB, cR].forEach(c => { c.width = c.height = S; });
      const a = cA.getContext('2d'), b = cB.getContext('2d'), r = cR.getContext('2d');
      const rows = 8, ph = S / rows;
      for (let row = 0; row < rows; row++) {

    function createVolumetricCone(topR, botR, height, colorHex, maxOpacity) {
      const geo = new THREE.CylinderGeometry(topR, botR, height, 24, 1, true);
      geo.translate(0, -height / 2, 0);
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
        uniforms: { uColor: { value: new THREE.Color(colorHex) }, uOpacity: { value: maxOpacity } },
        vertexShader: `
          varying vec2 vUv; varying vec3 vNormalV; varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormalV = normalize(normalMatrix * normal);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mv.xyz;
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform vec3 uColor; uniform float uOpacity;
          varying vec2 vUv; varying vec3 vNormalV; varying vec3 vViewPos;
          void main() {
            float fresnel = pow(abs(dot(normalize(vNormalV), normalize(vViewPos))), 1.85);
            float vertical = smoothstep(0.0, 0.72, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
            gl_FragColor = vec4(uColor, fresnel * vertical * uOpacity);
          }`
      });
      return new THREE.Mesh(geo, mat);
    }

    // LEFT ARCHITECTURAL SYLHET WINDOW — CUSTOM GLSL WET-GLASS RAIN SHADER + 3D MULLIONS
    const winShaderMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uWeather: { value: 0 },
        uRainAmount: { value: 1.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform float uWeather; uniform float uRainAmount;
        varying vec2 vUv;
        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        vec2 rainLayer(vec2 uv, float t, vec2 aspect) {
          vec2 st = uv * aspect;
          float idX = floor(st.x);
          st.y += t * 0.25;
          float n = hash21(vec2(idX, floor(st.y)));
          vec2 gv = fract(st) - 0.5;
          float x = (n - 0.5) * 0.72 + sin(uv.y * 22.0 + n * 6.28) * 0.06;
          float y = -sin(t + sin(t + sin(t) * 0.5)) * 0.42;
          y -= (gv.x - x) * (gv.x - x);
          vec2 dropPos = (gv - vec2(x, y)) / aspect;
          float drop = smoothstep(0.048, 0.018, length(dropPos));
          vec2 trailPos = (gv - vec2(x, t * 0.25)) / aspect;
          trailPos.y = (fract(trailPos.y * 8.0) - 0.5) / 8.0;
          float trail = smoothstep(0.026, 0.008, length(trailPos)) * smoothstep(-0.04, 0.05, dropPos.y) * smoothstep(0.45, y, gv.y);
          return dropPos * drop * 22.0 + trailPos * trail * 8.0;
        }
        vec3 sylhetBackdrop(vec2 uv) {
          float wDusk = clamp(1.0 - abs(uWeather - 1.0), 0.0, 1.0);
          float wMid  = clamp(uWeather - 1.0, 0.0, 1.0);
          float wRain = clamp(1.0 - uWeather, 0.0, 1.0);
          vec3 skyRain = mix(vec3(0.04, 0.07, 0.11), vec3(0.08, 0.16, 0.26), uv.y);
          vec3 skyDusk = mix(vec3(0.84, 0.48, 0.26), vec3(0.14, 0.11, 0.25), smoothstep(0.05, 0.85, uv.y));
          vec3 skyMid  = mix(vec3(0.03, 0.05, 0.10), vec3(0.015, 0.025, 0.06), uv.y);
          vec3 col = skyRain * wRain + skyDusk * wDusk + skyMid * wMid;
          if (wMid > 0.02) {
            vec2 sg = floor(uv * vec2(48.0, 64.0));
            float st = step(0.985, hash21(sg)) * smoothstep(0.35, 0.55, uv.y);
            col += vec3(0.85, 0.92, 1.0) * st * wMid * (0.65 + 0.35 * sin(uTime * 2.5 + sg.x));
          }
          float hill1 = 0.28 + sin(uv.x * 5.2) * 0.045 + cos(uv.x * 11.0) * 0.02;

            float d = length((uv - lp) * vec2(0.8, 1.0));

            col += lc * smoothstep(0.048, 0.004, d) * 0.55 * flick;
          }
          return col;
        }
        void main() {
          vec2 uv = vUv;
          vec2 offs = vec2(0.0);
          if (uRainAmount > 0.01) {
            offs += rainLayer(uv, uTime * 0.85, vec2(8.0, 4.0));

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
    }
    function wrapText(ctx, text, x, y, maxW, lineH) {
      const paras = text.split('\n'); let curY = y;
      paras.forEach(p => {
        const words = p.split(' '); let line = '';
        for (let n = 0; n < words.length; n++) {
          const test = line + words[n] + ' ';
          if (ctx.measureText(test).width > maxW && n > 0) { ctx.fillText(line, x, curY); line = words[n] + ' '; curY += lineH; }
          else line = test;
        }
        ctx.fillText(line, x, curY); curY += lineH;
      });
    }

    function buildArcadeWave(waveIdx) {
      arcade.bricks = [];
      arcade.powerups = [];
      arcade.lasers = [];
      const cols = 12, rows = 4, pad = 8;
      const bw = (arcade.bounds.w - 40 - (cols - 1) * pad) / cols;
      const bh = 24;
      const startX = arcade.bounds.x + 20, startY = arcade.bounds.y + 42;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (waveIdx === 1 && ((r + c) % 2 === 1) && r > 0) continue;
          if (waveIdx === 2 && (c === 5 || c === 6) && r === 1) continue;
          const hp = (r === 0 && waveIdx > 0) ? 2 : 1;
          arcade.bricks.push({
            x: startX + c * (bw + pad), y: startY + r * (bh + pad), w: bw, h: bh,
            hp, maxHp: hp, color: ARC_PALETTE[(r + waveIdx) % ARC_PALETTE.length], alive: true
          });
        }
      }

    }

      arcade.balls = [{ x: arcade.paddleX, y: arcade.bounds.y + arcade.bounds.h - 36, vx: 290, vy: -340, r: 8, stuck: true, trail: [] }];

      else if (arcade.mode === 'ready' || arcade.mode === 'paused') arcade.mode = 'playing';

        if (b.stuck) {
          b.stuck = false;
          const ang = -Math.PI / 2 + (Math.random() - 0.5) * 0.55;
          const spd = 450 + arcade.wave * 35;

          playChime(520, 780, 0.07, 0.04);

      });

    function spawnArcadeSparks(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, sp = 70 + Math.random() * 200;
        arcade.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.32 + Math.random() * 0.25, color });
      }
    }

    function updateArcade(dt) {
      if (app.uwTab !== 'arcade') return;
      const B = arcade.bounds;
      const pSpeed = 680;
      if (keysDown.has('a') || keysDown.has('arrowleft')) arcade.paddleX -= pSpeed * dt;
      if (keysDown.has('d') || keysDown.has('arrowright')) arcade.paddleX += pSpeed * dt;
      const pw = arcade.wideTimer > 0 ? 236 : 168;
      arcade.paddleW += (pw - arcade.paddleW) * Math.min(1, dt * 12);
      arcade.paddleX = Math.max(B.x + arcade.paddleW / 2 + 8, Math.min(B.x + B.w - arcade.paddleW / 2 - 8, arcade.paddleX));
      arcade.shake = Math.max(0, arcade.shake - dt * 28);

      // Update particles even when paused/ready
      for (let i = arcade.particles.length - 1; i >= 0; i--) {
        const p = arcade.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) arcade.particles.splice(i, 1);
      }

      if (arcade.mode !== 'playing') {
        arcade.balls.forEach(b => { if (b.stuck) b.x = arcade.paddleX; });
        return;
      }

      if (arcade.wideTimer > 0) arcade.wideTimer -= dt;
      if (arcade.ionTimer > 0) arcade.ionTimer -= dt;
      if (arcade.laserTimer > 0) {
        arcade.laserTimer -= dt;
        arcade.laserCd -= dt;
        if (arcade.laserCd <= 0) {
          arcade.laserCd = 0.28;
          const py = B.y + B.h - 28;
          arcade.lasers.push({ x: arcade.paddleX - arcade.paddleW * 0.36, y: py }, { x: arcade.paddleX + arcade.paddleW * 0.36, y: py });
          playFoley(1180, 0.03, 0.02, 'square');
        }
      }

      // Lasers vs bricks
      for (let i = arcade.lasers.length - 1; i >= 0; i--) {
        const l = arcade.lasers[i];
        l.y -= 680 * dt;
        if (l.y < B.y) { arcade.lasers.splice(i, 1); continue; }
        for (const br of arcade.bricks) {
          if (!br.alive) continue;
          if (l.x >= br.x && l.x <= br.x + br.w && l.y >= br.y && l.y <= br.y + br.h) {
            br.hp--; arcade.lasers.splice(i, 1);
            if (br.hp <= 0) { br.alive = false; arcade.score += 50; spawnArcadeSparks(l.x, l.y, br.color, 8); playArcadeHit(arcade.combo++); }
            break;
          }
        }
      }

      // Powerups
      const paddleY = B.y + B.h - 24;
      for (let i = arcade.powerups.length - 1; i >= 0; i--) {
        const pu = arcade.powerups[i];
        pu.y += 170 * dt;
        if (pu.y > B.y + B.h + 12) { arcade.powerups.splice(i, 1); continue; }
        if (Math.abs(pu.x - arcade.paddleX) < arcade.paddleW / 2 + 16 && Math.abs(pu.y - paddleY) < 18) {
          playChime(740, 1120, 0.11, 0.045);
          if (pu.type === 'MAG') { arcade.wideTimer = 10; showToast('Arcade Powerup: MAG Wide Paddle'); }
          else if (pu.type === 'ION') { arcade.ionTimer = 7; showToast('Arcade Powerup: ION Piercing Beam'); }
          else if (pu.type === 'LSR') { arcade.laserTimer = 7; showToast('Arcade Powerup: Twin Pulse Lasers'); }
          else if (pu.type === 'X3' && arcade.balls.length < 5) {
            const src = arcade.balls[0];
            if (src) {
              arcade.balls.push(
                { x: src.x, y: src.y, vx: src.vx * 0.9 + 110, vy: -Math.abs(src.vy), r: 8, stuck: false, trail: [] },
                { x: src.x, y: src.y, vx: src.vx * 0.9 - 110, vy: -Math.abs(src.vy), r: 8, stuck: false, trail: [] }
              );
            }
            showToast('Arcade Powerup: x3 Proton Split!');
          }
          arcade.powerups.splice(i, 1);
        }
      }

      // Balls
      for (let bi = arcade.balls.length - 1; bi >= 0; bi--) {
        const b = arcade.balls[bi];
        if (b.stuck) { b.x = arcade.paddleX; b.y = paddleY - 12; continue; }
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 9) b.trail.shift();
        b.x += b.vx * dt; b.y += b.vy * dt;

        if (b.x - b.r < B.x) { b.x = B.x + b.r; b.vx = Math.abs(b.vx); playFoley(340, 0.03, 0.025); }
        if (b.x + b.r > B.x + B.w) { b.x = B.x + B.w - b.r; b.vx = -Math.abs(b.vx); playFoley(340, 0.03, 0.025); }
        if (b.y - b.r < B.y) { b.y = B.y + b.r; b.vy = Math.abs(b.vy); playFoley(380, 0.03, 0.025); }

        // Paddle bounce
        if (b.vy > 0 && b.y + b.r >= paddleY - 6 && b.y - b.r <= paddleY + 10 && Math.abs(b.x - arcade.paddleX) <= arcade.paddleW / 2 + b.r) {
          const hitNorm = Math.max(-1, Math.min(1, (b.x - arcade.paddleX) / (arcade.paddleW / 2)));
          const spd = Math.min(680, Math.hypot(b.vx, b.vy) * 1.015);
          const ang = -Math.PI / 2 + hitNorm * 1.08;
          b.vx = Math.cos(ang) * spd; b.vy = Math.sin(ang) * spd;
          b.y = paddleY - 6 - b.r;
          arcade.combo = 0;
          playFoley(520, 0.04, 0.04, 'sine');
        }

        // Brick collisions
        for (const br of arcade.bricks) {
          if (!br.alive) continue;
          const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
          const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
          const dx = b.x - cx, dy = b.y - cy;
          if (dx * dx + dy * dy <= b.r * b.r) {
            if (arcade.ionTimer <= 0) {
              if (Math.abs(dx) > Math.abs(dy)) b.vx = -b.vx; else b.vy = -b.vy;
            }
            br.hp--;
            if (br.hp <= 0) {
              br.alive = false;
              arcade.combo++;
              arcade.score += 100 + Math.min(arcade.combo * 20, 200);
              if (arcade.score > arcade.best) {
                arcade.best = arcade.score;
                try { localStorage.setItem('rj_beamline_best', String(arcade.best)); } catch (_) {}
              }
              arcade.shake = 5;
              spawnArcadeSparks(cx, cy, br.color, 11);
              playArcadeHit(arcade.combo);
              if (Math.random() < 0.22) {
                const types = ['X3', 'MAG', 'ION', 'LSR'];
                arcade.powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, type: types[Math.floor(Math.random() * types.length)] });
              }
            } else {
              playFoley(420, 0.04, 0.035, 'square');
              spawnArcadeSparks(cx, cy, '#EAECEF', 5);
            }
            break;
          }
        }

        if (b.y - b.r > B.y + B.h + 12) arcade.balls.splice(bi, 1);
      }

      if (arcade.balls.length === 0) {
        arcade.lives--;
        arcade.shake = 9;
        playFoley(180, 0.16, 0.06, 'sawtooth');
        if (arcade.lives <= 0) { arcade.mode = 'over'; }

          '• Brotherhood in teams: lift the quietest contributor in the room — they often hold the sharpest insight.'
        ],
        marginNote: 'Rajshahi Cadet College · College Prefect · 297 Cadets',
        diagram: 'rcc'
      }
    }
  ];

  // ==========================================================================
  // 2. PHYSICAL DIMENSIONS & CONSTANTS (METERS, MATCHING DESK SCALE)
  // ==========================================================================
  const PAGE_W      = 0.195;  // Single page width (open spread = 0.390m)
  const PAGE_H      = 0.268;  // Page height (classic A5/XL Moleskine ratio)
  const SEG_X       = 24;     // Subdivisions along bend axis (spine -> outer)
  const SEG_Z       = 6;      // Subdivisions along spine height (top -> bottom)
  const COVER_OVER  = 0.009;  // Hardcover board overhang beyond page edges
  const COVER_W     = PAGE_W + COVER_OVER;
  const COVER_H     = PAGE_H + COVER_OVER * 2;
  const COVER_THICK = 0.0045;
  const SPINE_GAP   = 0.006;  // Half-width of center spine trough
  const BLOCK_THICK = 0.0135; // 200-page creamy paper block thickness
  const PAGE_BASE_Y = COVER_THICK + BLOCK_THICK; // Resting outer page height

  // ==========================================================================
  // 3. PROCEDURAL PBR TEXTURES (STITCHED ESPRESSO LEATHER & LAYERED PAPER EDGE)
  // ==========================================================================
  function createLeatherMaps() {
    const size = 512;
    const colCanvas = document.createElement('canvas');
    colCanvas.width = colCanvas.height = size;
    const cctx = colCanvas.getContext('2d');

    const bumpCanvas = document.createElement('canvas');
    bumpCanvas.width = bumpCanvas.height = size;
    const bctx = bumpCanvas.getContext('2d');

    // Deep espresso base with subtle edge burnishing
    const grad = cctx.createRadialGradient(size * 0.5, size * 0.5, size * 0.1, size * 0.5, size * 0.5, size * 0.72);
    grad.addColorStop(0, '#312118');
    grad.addColorStop(0.75, '#251811');
    grad.addColorStop(1, '#180f0a');
    cctx.fillStyle = grad;
    cctx.fillRect(0, 0, size, size);

    bctx.fillStyle = '#808080';
    bctx.fillRect(0, 0, size, size);

    // Deterministic pseudo-random pebble grain (zero flicker, fast startup)
    let seed = 4219;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let i = 0; i < 6500; i++) {
      const x = rand() * size;
      const y = rand() * size;
      const r = 0.8 + rand() * 2.1;
      const shade = rand() > 0.5 ? 'rgba(255,220,185,0.035)' : 'rgba(8,4,2,0.09)';
      cctx.fillStyle = shade;
      cctx.beginPath(); cctx.arc(x, y, r, 0, Math.PI * 2); cctx.fill();

      const bVal = Math.floor(105 + rand() * 52);
      bctx.fillStyle = `rgb(${bVal},${bVal},${bVal})`;
      bctx.beginPath(); bctx.arc(x, y, r * 0.9, 0, Math.PI * 2); bctx.fill();
    }

    // Perimeter saddle-stitching (warm waxed linen thread)
    const inset = 18;
    cctx.save();
    cctx.strokeStyle = 'rgba(138, 102, 68, 0.72)';
    cctx.lineWidth = 2.2;
    cctx.setLineDash([7, 5]);
    cctx.strokeRect(inset, inset, size - inset * 2, size - inset * 2);
    cctx.restore();

    bctx.save();
    bctx.strokeStyle = '#d8d8d8';
    bctx.lineWidth = 2.6;
    bctx.setLineDash([7, 5]);
    bctx.strokeRect(inset, inset, size - inset * 2, size - inset * 2);
    bctx.restore();

    const map = new THREE.CanvasTexture(colCanvas);
    map.anisotropy = 4; map.encoding = THREE.sRGBEncoding;
    const bumpMap = new THREE.CanvasTexture(bumpCanvas);
    bumpMap.anisotropy = 4;
    return { map, bumpMap };
  }

  function createPageEdgeTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#e7decb';
    ctx.fillRect(0, 0, 256, 128);

    // Fine horizontal 200-page sheet striations
    let seed = 1337;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let y = 0; y < 128; y += 2) {
      const tone = 212 + Math.floor((rand() - 0.5) * 26);
      ctx.fillStyle = `rgb(${tone}, ${tone - 9}, ${tone - 24})`;
      ctx.fillRect(0, y, 256, 1.3);
      if (y % 6 === 0) {
        ctx.fillStyle = 'rgba(85, 68, 48, 0.16)';
        ctx.fillRect(0, y + 1, 256, 0.8);
      }
    }
    // Subtle vertical ambient occlusion near top/bottom cover contact
    const ao = ctx.createLinearGradient(0, 0, 0, 128);
    ao.addColorStop(0, 'rgba(35, 22, 12, 0.22)');
    ao.addColorStop(0.15, 'rgba(35, 22, 12, 0)');
    ao.addColorStop(0.85, 'rgba(35, 22, 12, 0)');
    ao.addColorStop(1, 'rgba(35, 22, 12, 0.34)');
    ctx.fillStyle = ao;
    ctx.fillRect(0, 0, 256, 128);

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.anisotropy = 4;
    return tex;
  }

  function createDynamicShadowTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 256, 0);
    g.addColorStop(0.0, 'rgba(18, 12, 8, 0.0)');
    g.addColorStop(0.32, 'rgba(18, 12, 8, 0.22)');
    g.addColorStop(0.50, 'rgba(18, 12, 8, 0.58)');
    g.addColorStop(0.68, 'rgba(18, 12, 8, 0.20)');
    g.addColorStop(1.0, 'rgba(18, 12, 8, 0.0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 64);
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }

  // Pre-rendered archival cotton paper fiber tile (stamped once per page draw)
  const fiberTile = (function buildPaperFiberTile() {
    const c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f4edde';
    ctx.fillRect(0, 0, 160, 160);
    let seed = 9001;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let i = 0; i < 1100; i++) {
      const x = rand() * 160, y = rand() * 160;
      ctx.fillStyle = rand() > 0.5 ? 'rgba(150, 126, 94, 0.045)' : 'rgba(255, 252, 244, 0.08)';
      ctx.fillRect(x, y, 1 + rand() * 2.2, 1);
    }
    // Delicate cotton fibers
    ctx.strokeStyle = 'rgba(140, 118, 88, 0.05)';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < 42; i++) {
      const x = rand() * 160, y = rand() * 160;
      const a = rand() * Math.PI * 2, len = 4 + rand() * 8;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
    }
    return c;
  })();

  // ==========================================================================
  // 4. ARCHIVAL PAPER TYPOGRAPHY CANVAS RENDERER (640 x 880 PER PAGE)
  // ==========================================================================
  const PAGE_CANVAS_W = 640;
  const PAGE_CANVAS_H = 880;

  function drawWrappedSerif(ctx, text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '';
    let curY = y;
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i] + ' ';
      if (ctx.measureText(test).width > maxW && i > 0) {
        ctx.fillText(line.trimEnd(), x, curY);
        line = words[i] + ' ';
        curY += lineH;
      } else {
        line = test;
      }
    }
    if (line.trim()) {
      ctx.fillText(line.trimEnd(), x, curY);
      curY += lineH;
    }
    return curY;
  }

  function drawMiniSketch(ctx, kind, x, y, w, h) {
    ctx.save();
    ctx.fillStyle = 'rgba(15, 118, 110, 0.05)';
    ctx.strokeStyle = 'rgba(30, 41, 59, 0.16)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.stroke();

    if (kind === 'framebudget') {
      // Subtle 16.6ms bar breakdown
      const bars = [
        { label: 'RK4', pct: 0.12, col: '#0f766e' },
        { label: 'VBO', pct: 0.20, col: '#2563eb' },
        { label: 'FRAG', pct: 0.34, col: '#b45309' },
        { label: 'IDLE', pct: 0.34, col: 'rgba(15,118,110,0.22)' }
      ];
      let bx = x + 18;
      const bw = w - 36;
      bars.forEach(b => {
        const seg = bw * b.pct;
        ctx.fillStyle = b.col;
        ctx.fillRect(bx, y + 36, seg - 3, 20);
        ctx.fillStyle = '#334155';
        ctx.font = '600 10px "JetBrains Mono", monospace';
        ctx.fillText(b.label, bx + 2, y + 74);
        bx += seg;
      });
      ctx.fillStyle = '#475569';
      ctx.font = '600 11px "JetBrains Mono", monospace';
      ctx.fillText('16.6ms BUDGET · ZERO-ALLOC PIPELINE', x + 18, y + 24);
    } else if (kind === 'monsoon') {
      // Minimal raindrop ripple diagram
      ctx.strokeStyle = 'rgba(15, 118, 110, 0.45)';
      ctx.lineWidth = 1.4;
      for (let r = 10; r <= 34; r += 12) {
        ctx.beginPath(); ctx.ellipse(x + w * 0.5, y + h * 0.56, r * 2.2, r * 0.58, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = '#0f766e';
      ctx.font = 'italic 13px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('Local-first · Tactile · Unhurried', x + w * 0.5, y + 26);
    } else if (kind === 'rcc') {
      // Subtle crest & 3-pillar cadence
      ctx.fillStyle = '#7c2d12';
      ctx.font = '600 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PREPARATION  ·  COMPOSURE  ·  OWNERSHIP', x + w * 0.5, y + 34);
      ctx.strokeStyle = 'rgba(124, 45, 18, 0.35)';
      ctx.beginPath(); ctx.moveTo(x + 38, y + 52); ctx.lineTo(x + w - 38, y + 52); ctx.stroke();
      ctx.fillStyle = '#475569';
      ctx.font = 'italic 13px Georgia, serif';
      ctx.fillText('Rajshahi Cadet College · 59th Intake', x + w * 0.5, y + 74);
    } else {
      // Pacing curve (sine wave settling into calm focus)
      ctx.strokeStyle = 'rgba(15, 118, 110, 0.55)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (let px = 0; px <= w - 40; px += 4) {
        const u = px / (w - 40);
        const amp = (1 - u * 0.65) * 18;
        const py = y + h * 0.56 + Math.sin(u * Math.PI * 5) * amp;
        if (px === 0) ctx.moveTo(x + 20 + px, py); else ctx.lineTo(x + 20 + px, py);
      }
      ctx.stroke();
      ctx.fillStyle = '#475569';
      ctx.font = '600 10px "JetBrains Mono", monospace';
      ctx.fillText('NOISE  ───────────────────────▶  STILLNESS', x + 22, y + 24);
    }
    ctx.restore();
  }

  /**
   * Renders a single page ('left' or 'right') of a spread onto a 640x880 canvas.
   * Includes archival fiber grain, ruled lines, spine gutter AO, editorial serif
   * typography, folio number, and subtle interactive corner indicators.
   */
  function renderPageToCanvas(canvas, spreadIdx, side, isCornerHovered) {
    const ctx = canvas.getContext('2d');
    const spread = INKWELL_SPREADS[spreadIdx];
    const data = side === 'left' ? spread.left : spread.right;
    const W = canvas.width;
    const H = canvas.height;

    // 1. Warm archival cream paper + cotton fiber pattern
    const pat = ctx.createPattern(fiberTile, 'repeat');
    ctx.fillStyle = pat || '#f4edde';
    ctx.fillRect(0, 0, W, H);

    // Subtle aged paper perimeter warmth
    const vig = ctx.createRadialGradient(W * 0.5, H * 0.48, W * 0.25, W * 0.5, H * 0.5, W * 0.85);
    vig.addColorStop(0, 'rgba(255, 252, 245, 0.14)');
    vig.addColorStop(1, 'rgba(148, 122, 86, 0.14)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // 2. Fine ruled notebook lines + inner margin rule
    const padLeft  = side === 'left' ? 56 : 74;
    const padRight = side === 'left' ? 74 : 56;
    const textW = W - padLeft - padRight;

    ctx.strokeStyle = 'rgba(51, 65, 85, 0.085)';
    ctx.lineWidth = 1;
    for (let y = 136; y <= H - 108; y += 30) {
      ctx.beginPath(); ctx.moveTo(padLeft - 8, y); ctx.lineTo(W - padRight + 8, y); ctx.stroke();
    }

    // Subtle crimson margin rule
    ctx.strokeStyle = 'rgba(153, 27, 27, 0.14)';
    ctx.beginPath();
    const marginRuleX = side === 'left' ? padLeft - 14 : W - padRight + 14;
    ctx.moveTo(marginRuleX, 86); ctx.lineTo(marginRuleX, H - 86);
    ctx.stroke();

    // 3. Running Header & Ornamental Hairline
    ctx.fillStyle = '#0f766e';
    ctx.font = '600 13px "JetBrains Mono", monospace';
    ctx.textAlign = side === 'left' ? 'left' : 'right';
    ctx.fillText(data.header, side === 'left' ? padLeft : W - padRight, 64);

    ctx.fillStyle = 'rgba(71, 85, 105, 0.62)';
    ctx.font = '500 12px "JetBrains Mono", monospace';
    ctx.textAlign = side === 'left' ? 'right' : 'left';
    ctx.fillText(`INKWELL · ${spreadIdx + 1}/${INKWELL_SPREADS.length}`, side === 'left' ? W - padRight : padLeft, 64);

    ctx.strokeStyle = 'rgba(30, 41, 59, 0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(padLeft, 80); ctx.lineTo(W - padRight, 80); ctx.stroke();
    ctx.textAlign = 'left';

    // 4. Editorial Body Layout
    let curY = 124;
    if (side === 'left') {
      // Chapter / Essay Title
      ctx.fillStyle = '#18181b';
      ctx.font = '700 32px Georgia, "Palatino Linotype", serif';
      curY = drawWrappedSerif(ctx, data.title, padLeft, curY, textW, 38);

      // Italic Subtitle
      ctx.fillStyle = '#0f766e';
      ctx.font = 'italic 17px Georgia, serif';
      curY = drawWrappedSerif(ctx, data.subtitle, padLeft, curY + 6, textW, 24);

      // Short decorative rule
      ctx.strokeStyle = '#0f766e';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(padLeft, curY + 4); ctx.lineTo(padLeft + 54, curY + 4); ctx.stroke();
      curY += 32;

      // Lead Paragraph
      ctx.fillStyle = '#1e293b';
      ctx.font = '600 17.5px Georgia, serif';
      curY = drawWrappedSerif(ctx, data.lead, padLeft, curY, textW, 29);
      curY += 12;

      // Body Paragraphs
      ctx.fillStyle = '#334155';
      ctx.font = '400 16.5px Georgia, serif';
      data.body.forEach(p => {
        curY = drawWrappedSerif(ctx, p, padLeft, curY, textW, 28);
        curY += 12;
      });

      // Pull-quote callout near bottom
      if (data.quote) {
        const qY = Math.max(curY + 8, H - 196);
        ctx.fillStyle = 'rgba(15, 118, 110, 0.06)';
        ctx.fillRect(padLeft, qY - 22, textW, 82);
        ctx.fillStyle = '#0f766e';
        ctx.fillRect(padLeft, qY - 22, 3.5, 82);
        ctx.fillStyle = '#1e293b';
        ctx.font = 'italic 16px Georgia, serif';
        drawWrappedSerif(ctx, data.quote, padLeft + 16, qY + 4, textW - 26, 24);
      }
    } else {
      // Right Page: Section Heading, Structured Points, Mini Sketch & Margin Note
      ctx.fillStyle = '#18181b';
      ctx.font = '700 24px Georgia, "Palatino Linotype", serif';
      curY = drawWrappedSerif(ctx, data.sectionTitle, padLeft, curY, textW, 32);
      curY += 14;

      ctx.fillStyle = '#334155';
      ctx.font = '400 16.5px Georgia, serif';
      data.body.forEach(p => {
        curY = drawWrappedSerif(ctx, p, padLeft, curY, textW, 28);
        curY += 16;
      });

      // Architectural mini diagram / sketch
      const sketchY = Math.max(curY + 14, 486);
      drawMiniSketch(ctx, data.diagram, padLeft, sketchY, textW, 102);

      // Handwritten-style margin colophon
      if (data.marginNote) {
        ctx.fillStyle = 'rgba(71, 85, 105, 0.78)';
        ctx.font = 'italic 14px Georgia, serif';
        ctx.fillText('— ' + data.marginNote, padLeft, sketchY + 136);
      }
    }

    // 5. Footer: Page Folio & Subtle Corner Turn Indicator (`← Prev` / `Next →`)
    const footerY = H - 46;
    ctx.strokeStyle = 'rgba(30, 41, 59, 0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padLeft, footerY - 26); ctx.lineTo(W - padRight, footerY - 26); ctx.stroke();

    // Folio number
    ctx.fillStyle = 'rgba(51, 65, 85, 0.65)';
    ctx.font = '600 13px "JetBrains Mono", monospace';
    ctx.textAlign = side === 'left' ? 'right' : 'left';
    ctx.fillText(data.folio, side === 'left' ? W - padRight : padLeft, footerY);

    // Interactive Corner Hint (`← Prev` on left outer corner, `Next →` on right outer corner)
    const hintLabel = side === 'left' ? '← Prev' : 'Next →';
    const pillW = 94, pillH = 30;
    const pillX = side === 'left' ? padLeft : W - padRight - pillW;
    const pillY = footerY - 20;

    if (isCornerHovered) {
      ctx.fillStyle = '#0f766e';
      ctx.beginPath();
      ctx.rect(pillX, pillY, pillW, pillH);
      ctx.fill();
      ctx.fillStyle = '#f8fafc';
    } else {
      ctx.strokeStyle = 'rgba(15, 118, 110, 0.32)';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(pillX, pillY, pillW, pillH);
      ctx.fillStyle = '#0f766e';
    }
    ctx.font = '600 13px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(hintLabel, pillX + pillW * 0.5, pillY + 20);
    ctx.textAlign = 'left';

    // 6. Realistic Spine Gutter Ambient Occlusion Shading
    const gutterW = 82;
    const gx0 = side === 'left' ? W - gutterW : 0;
    const gx1 = side === 'left' ? W : gutterW;
    const gutterGrad = ctx.createLinearGradient(gx0, 0, gx1, 0);
    if (side === 'left') {
      gutterGrad.addColorStop(0.0, 'rgba(24, 16, 10, 0.0)');
      gutterGrad.addColorStop(0.55, 'rgba(24, 16, 10, 0.08)');
      gutterGrad.addColorStop(0.86, 'rgba(24, 16, 10, 0.24)');
      gutterGrad.addColorStop(1.0, 'rgba(16, 10, 6, 0.44)');
    } else {
      gutterGrad.addColorStop(0.0, 'rgba(16, 10, 6, 0.44)');
      gutterGrad.addColorStop(0.14, 'rgba(24, 16, 10, 0.24)');
      gutterGrad.addColorStop(0.45, 'rgba(24, 16, 10, 0.08)');
      gutterGrad.addColorStop(1.0, 'rgba(24, 16, 10, 0.0)');
    }
    ctx.fillStyle = gutterGrad;
    ctx.fillRect(gx0, 0, gutterW, H);
  }

  // ==========================================================================
  // 5. MATHEMATICAL PAPER DEFORMATION ENGINE (ZERO-ALLOCATION)
  // ==========================================================================
  /**
   * Natural resting height profile of an open book page along normalized
   * spine-to-outer coordinate u in [0, 1].
   *  - u = 0 (spine): dips smoothly into the binding crease (-4.5mm)
   *  - u ~ 0.32: gentle convex arch crown (+6.8mm)
   *  - u = 1 (fore-edge): settles flush onto the paper block (0mm)
   */
  function restingArchHeight(u) {
    const crown = Math.sin(Math.pow(u, 0.72) * Math.PI) * 0.0068;
    const creaseDip = Math.exp(-u * 10.5) * 0.0046;
    return crown - creaseDip;
  }

  function smoothstep(edge0, edge1, x) {
    const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  /**
   * Builds a subdivided page geometry (24 x 6) and pre-caches normalized
   * (u, v) coordinates on `geo.userData` so per-frame deformation allocates
   * ZERO objects.
   *   side = 'right' -> u in [0, 1] maps x from 0 (spine) to +PAGE_W
   *   side = 'left'  -> u in [0, 1] maps x from -PAGE_W (outer) to 0 (spine)
   */
  function createPageGeometry(side) {
    const geo = new THREE.PlaneGeometry(PAGE_W, PAGE_H, SEG_X, SEG_Z);
    const pos = geo.attributes.position;
    const count = pos.count;
    const uArr = new Float32Array(count);
    const vArr = new Float32Array(count);

    const cols = SEG_X + 1;
    for (let i = 0; i < count; i++) {
      const ix = i % cols;
      const iy = (i - ix) / cols;
      const uNorm = ix / SEG_X;          // 0 -> 1 across PlaneGeometry X
      const vNorm = iy / SEG_Z - 0.5;    // -0.5 (top/-Z) -> +0.5 (bottom/+Z)
      uArr[i] = side === 'left' ? (1 - uNorm) : uNorm; // Distance from spine [0..1]
      vArr[i] = vNorm;
    }
    geo.userData.uArr = uArr;
    geo.userData.vArr = vArr;
    geo.userData.side = side;
    return geo;
  }

  /**
   * Deforms a resting static page ('left' or 'right') with its natural book
   * arch PLUS an interactive +8mm corner-lift curl on hover (`liftAmount` 0..1).
   */
  function deformRestingPage(geo, side, liftAmount) {
    const pos = geo.attributes.position;
    const uArr = geo.userData.uArr;
    const vArr = geo.userData.vArr;
    const sign = side === 'right' ? 1 : -1;
    const lift = Math.max(0, Math.min(1, liftAmount || 0));

    for (let i = 0; i < pos.count; i++) {
      const u = uArr[i]; // 0 at spine, 1 at outer fore-edge
      const v = vArr[i]; // -0.5 top, +0.5 bottom

      let x = sign * u * PAGE_W;
      let y = PAGE_BASE_Y + restingArchHeight(u);
      let z = v * PAGE_H;

      // Interactive +8mm outer-corner curl inviting the user to flip
      if (lift > 0.0005) {
        const uMask = smoothstep(0.42, 1.0, u);
        const vMask = smoothstep(-0.22, 0.5, v); // Bottom outer corner leads
        const cornerW = uMask * (0.28 + 0.72 * vMask);
        const curlY = 0.0085 * lift * cornerW * cornerW; // +8.5mm gentle lift
        const curlIn = 0.0042 * lift * cornerW * uMask;  // Slight inward tuck
        y += curlY;
        x -= sign * curlIn;
      }

      pos.setXYZ(i, x, y, z);
    }

    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }

  /**
   * Exact mathematical vertex-bending function for the 3D turning leaf.
   * Pivoted at the center spine (x = 0).
   *

    const dir = direction >= 0 ? 1 : -1;
    const pos = geo.attributes.position;
    const uArr = geo.userData.uArr;
    const vArr = geo.userData.vArr;

    const envelope = Math.sin(Math.PI * p);
    const thetaBase = p * Math.PI;
    const restWeight = 1.0 - Math.pow(envelope, 0.62);

      const v = vArr[i]; // -0.5 top (-Z), +0.5 bottom (+Z)

    // FIXED: Unified UV-to-Canvas mapping (removed erroneous 1 - uv.x flip on ultrawide!)
    const SCREEN_CANVAS = {

    };
    function uvToCanvas(screenId, uv) {
      const c = SCREEN_CANVAS[screenId];
      return { x: uv.x * c.width, y: (1 - uv.y) * c.height };
    }

    function findHitbox(screenId, pt) {
      const list = hitboxes[screenId] || [];
      for (let i = list.length - 1; i >= 0; i--) {
        const b = list[i];
        if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) return b;
      }
      return null;
    }

    function pickClosestInteractive(ndcVec) {
      raycaster.setFromCamera(ndcVec, camera);
      const hits = raycaster.intersectObjects(raycastPool, false);
      for (const h of hits) {
        const ud = h.object.userData;
        if (ud && ud.interactType) {
          if ((ud.interactType === 'resume' || ud.interactType === 'medal') && !app.drawerOpen) continue;
          if (ud.interactType === 'pcInternal' && !app.pcGlassOpen) continue;
          return h;
        }
        return null; // Solid occluder blocked the ray
      }
      return null;
    }

    let pointerX = 0, pointerY = 0, isDragging = false, dragMoved = false, downX = 0, downY = 0, startX = 0, startY = 0;

      if (isDragging && app.focus === 'overview') {

    // 9. CRITICALLY DAMPED SPRING CAMERA, PROP JUICE, 3D PAGE-FLIP & 60 FPS LOOP
    // =========================================================================
    const curCam = new THREE.Vector3(0.3, 3.1, 6.2), curLook = new THREE.Vector3(0, 1.12, -0.25);
    const camVel = new THREE.Vector3(), lookVel = new THREE.Vector3();
    const tgtCam = new THREE.Vector3(), tgtLook = new THREE.Vector3();
    const tmpBarCol = new THREE.Color();
    const clock = new THREE.Clock();
    let lastUi = 0;

    function stepSpringVec3(cur, vel, tgt, omega, dt) {
      const f = 1 + 2 * dt * omega;
      const oo = omega * omega, hoo = dt * oo, hhoo = dt * hoo;
      const detInv = 1 / (f + hhoo);
      const nx = (f * cur.x + dt * vel.x + hhoo * tgt.x) * detInv;
      const vx = (vel.x + hoo * (tgt.x - cur.x)) * detInv;
      const ny = (f * cur.y + dt * vel.y + hhoo * tgt.y) * detInv;
      const vy = (vel.y + hoo * (tgt.y - cur.y)) * detInv;
      const nz = (f * cur.z + dt * vel.z + hhoo * tgt.z) * detInv;
      const vz = (vel.z + hoo * (tgt.z - cur.z)) * detInv;
      cur.set(nx, ny, nz); vel.set(vx, vy, vz);
    }

    const PROP_JUICE = {
      keyboard: { obj: kbGroup,    baseY: 0.80,  lift: 0.005, recoil: 0 },
      mouse:    { obj: mouseGroup, baseY: 0.796, lift: 0.006, recoil: 0 },
      mug:      { obj: mugGroup,   baseY: 0.786, lift: 0.007, recoil: 0 },
      books:    { obj: booksGroup, baseY: 0.795, lift: 0.006, recoil: 0 },
      gyro:     { obj: gyroGroup,  baseY: 0.89,  lift: 0.008, recoil: 0 },
      plant:    { obj: plantGroup, baseY: 0.86,  lift: 0.005, recoil: 0 }
    };

    lucide.createIcons();
    drawUltrawide(0); drawVerticalIDE(); drawIPad(0); drawWallMap(); drawScope(0);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      const damp = 1 - Math.exp(-5.8 * dt);

      // WASD gentle room navigation in overview
      if (app.focus === 'overview') {
        if (keysDown.has('a') || keysDown.has('arrowleft')) targetYaw = Math.max(-0.72, targetYaw - 1.1 * dt);
        if (keysDown.has('d') || keysDown.has('arrowright')) targetYaw = Math.min(0.72, targetYaw + 1.1 * dt);
        if (keysDown.has('w') || keysDown.has('arrowup')) zoomOffset = Math.max(-1.4, zoomOffset - 1.8 * dt);
        if (keysDown.has('s') || keysDown.has('arrowdown')) zoomOffset = Math.min(1.2, zoomOffset + 1.8 * dt);
      }

      const cfg = CAM_PRESETS[app.focus] || CAM_PRESETS.overview;
      orbitYaw += (targetYaw - orbitYaw) * damp;
      orbitPitch += (targetPitch - orbitPitch) * damp;

      if (app.focus === 'overview') {
        const rad = 4.35 + zoomOffset;
        tgtCam.set(Math.sin(orbitYaw) * rad + pointerX * 0.2, cfg.cam[1] + orbitPitch * 1.2 + pointerY * 0.1, Math.cos(orbitYaw) * rad - 0.1);
      } else {
        tgtCam.set(cfg.cam[0] + pointerX * 0.018, cfg.cam[1] + pointerY * 0.014, cfg.cam[2]);
      }
      // Subtle organic studio breathing sway (rock-steady when focused on screens/book)
      const breathScale = app.focus === 'overview' ? 1.0 : 0.10;
      tgtCam.y += Math.sin(t * 0.72) * 0.014 * breathScale;
      tgtCam.x += Math.cos(t * 0.48) * 0.018 * breathScale;
      tgtLook.set(cfg.look[0], cfg.look[1], cfg.look[2]);

      stepSpringVec3(curCam, camVel, tgtCam, 7.2, dt);
      stepSpringVec3(curLook, lookVel, tgtLook, 8.0, dt);
      camera.position.copy(curCam); camera.lookAt(curLook);
      if (Math.abs(camera.fov - cfg.fov) > 0.02) { camera.fov += (cfg.fov - camera.fov) * damp; camera.updateProjectionMatrix(); }

      // Cursor-reactive desk specular light
      cursorSpecLight.position.x += (pointerX * 1.45 - cursorSpecLight.position.x) * damp;
      cursorSpecLight.position.z += (0.12 - pointerY * 0.45 - cursorSpecLight.position.z) * damp;

      // Lamp, Monitor Bar Light, Volumetric Cones & Floating Dust Motes
      deskLampLight.intensity += ((app.lampOn ? 2.8 : 0.0) - deskLampLight.intensity) * damp;
      lampBulbMat.color.set(app.lampOn ? '#ffe4a8' : '#3a4252');
      lampVolCone.material.uniforms.uOpacity.value = (deskLampLight.intensity / 2.8) * 0.13;

      const lb = LIGHTBAR_MODES[app.lightBarIdx];
      monitorBarLight.intensity += (lb.intensity - monitorBarLight.intensity) * damp;
      if (lb.intensity > 0) {
        tmpBarCol.set(lb.color);
        monitorBarLight.color.lerp(tmpBarCol, damp);
        barVolCone.material.uniforms.uColor.value.copy(monitorBarLight.color);
      }
      barVolCone.material.uniforms.uOpacity.value = (monitorBarLight.intensity / 2.6) * 0.075;

      dustMat.uniforms.uTime.value = t;
      dustMat.uniforms.uLampOn.value = deskLampLight.intensity / 2.8;

      // GLSL Wet-Glass Sylhet Window Shader smooth weather transition
      winShaderMat.uniforms.uTime.value = t;
      winShaderMat.uniforms.uWeather.value += (app.weatherIdx - winShaderMat.uniforms.uWeather.value) * damp;
      const targetRain = app.weatherIdx === 0 ? 1.0 : app.weatherIdx === 1 ? 0.12 : 0.0;
      winShaderMat.uniforms.uRainAmount.value += (targetRain - winShaderMat.uniforms.uRainAmount.value) * damp;

      // Drawer, Resume Hover Lift, RCC Medal Spin & PC Glass Physics
      drawerGroup.position.z += ((app.drawerOpen ? 0.96 : 0.34) - drawerGroup.position.z) * damp;
      resumeSheet.position.y += ((app.hoveredType === 'resume' ? -0.036 : -0.054) - resumeSheet.position.y) * damp;
      if (app.medalSpinVel > 0.05) { rccMedal.rotation.y += app.medalSpinVel * dt; app.medalSpinVel *= Math.exp(-3.2 * dt); }
      glassDoor.position.z += ((app.pcGlassOpen ? 0.34 : 0.228) - glassDoor.position.z) * damp;
      glassDoor.position.x += ((app.pcGlassOpen ? -0.18 : 0) - glassDoor.position.x) * damp;

      // PC Fans, Scope Knobs, Burst, Speaker Woofer Pulse, Organic Fern Rustle
      const fanSpd = (app.pcOverclock ? 18 : 5.5) * dt;
      for (let i = 0; i < fanGroups.length; i++) fanGroups[i].rotation.z += fanSpd;
      cpuRing.rotation.z -= fanSpd * 0.45;
      scopeKnobs.forEach(k => { k.rotation.y += (app.scopeKnobAngle - k.rotation.y) * damp; });
      if (app.scopeBurst > 0) app.scopeBurst = Math.max(0, app.scopeBurst - dt * 1.4);

      app.speakerPulse *= 0.9;
      const coneScale = app.musicPlaying ? 1 + app.speakerPulse * 0.08 + Math.abs(Math.sin(t * 7)) * 0.025 : 1;
      speakerCones.forEach(c => c.scale.set(coneScale, 1, coneScale));

      if (app.plantRustle > 0) app.plantRustle = Math.max(0, app.plantRustle - dt * 1.6);
      leaves.forEach((lf, i) => {
        const sway = Math.sin(t * 1.4 + i) * 0.02 + Math.sin(t * 24 + i * 1.7) * 0.14 * app.plantRustle;
        lf.rotation.z = lf.userData.baseRotZ + sway;
      });

      // Hover Lift + Tactile Click Recoil on Desk Props
      for (const [type, p] of Object.entries(PROP_JUICE)) {
        if (type === 'mug' && (app.mugSipTimer > 0 || app.mugHop > 0)) continue;
        if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 6.5);
        const hoverOff = app.hoveredType === type ? p.lift : 0;
        const clickDip = -Math.sin(p.recoil * Math.PI) * 0.008;
        p.obj.position.y += (p.baseY + hoverOff + clickDip - p.obj.position.y) * damp;
      }

      // Mouse, Pen, Books, Mug Sip Arc & Steam, Instanced Keycap Wave, Gyro
      if (app.mouseNudge > 0) app.mouseNudge = Math.max(0, app.mouseNudge - dt * 5.0);
      mouseGroup.position.z = mouseBaseZ - Math.sin(app.mouseNudge * Math.PI) * 0.018;
      penGroup.rotation.x += (app.penRoll - penGroup.rotation.x) * damp;
      bookMeshes[2].position.x += ((app.bookSlide ? 0.055 : 0) - bookMeshes[2].position.x) * damp;

      if (app.mugHop > 0) app.mugHop = Math.max(0, app.mugHop - dt * 2.2);
      if (app.mugSipTimer > 0) {
        app.mugSipTimer = Math.max(0, app.mugSipTimer - dt);
        const arc = Math.sin((1 - app.mugSipTimer / 1.6) * Math.PI);
        mugGroup.position.y = mugBase.y + arc * 0.22; mugGroup.rotation.z = arc * 0.35;
      } else {
        if (app.mugHop > 0) mugGroup.position.y = mugBase.y + Math.sin(app.mugHop * Math.PI * 4) * 0.014 * app.mugHop;
        mugGroup.rotation.z *= 0.9;
      }
      const spA = steamGeo.attributes.position;
      for (let i = 0; i < steamN; i++) {
        const life = (t * 0.36 + steamSeeds[i]) % 1;
        spA.setXYZ(i, mugGroup.position.x + Math.sin(t * 2 + i) * 0.022 * life, mugGroup.position.y + 0.115 + life * 0.25, mugGroup.position.z + Math.cos(t * 1.8 + i) * 0.022 * life);
      }
      spA.needsUpdate = true;

      if (app.kbWaveTimer > 0) {
        app.kbWaveTimer = Math.max(0, app.kbWaveTimer - dt);
        capCoords.forEach((k, i) => {
          const dip = app.kbWaveTimer > 0.02 ? Math.abs(Math.sin(t * 32 + k.row * 0.9 + k.x * 12)) * 0.005 : 0;
          _kDummy.position.set(k.x, k.y - dip, k.z); _kDummy.scale.set(k.sx, 1, 1);
          _kDummy.updateMatrix(); keyInst.setMatrixAt(i, _kDummy.matrix);
        });
        keyInst.instanceMatrix.needsUpdate = true;
      }

      gyroOuter.rotation.y += app.gyroSpinVel * dt;
      gyroInner.rotation.x += app.gyroSpinVel * 1.45 * dt;
      app.gyroSpinVel += (0.65 - app.gyroSpinVel) * Math.min(1, dt * 1.4);

      // Update Real 3D Curved Page-Flip Book + Arcade + Diegetic Screens
      inkwellBook.update(dt);
      updateArcade(dt);
      drawScope(t);
      if (app.vertDirty) drawVerticalIDE();
      if (app.mapDirty) drawWallMap();
      if (app.uwTab === 'arcade') {
        drawUltrawide(t);
        if (t - lastUi > 0.05) { drawIPad(t); lastUi = t; }
      } else if (t - lastUi > 0.05) {
        drawUltrawide(t);
        drawIPad(t);
        lastUi = t;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
